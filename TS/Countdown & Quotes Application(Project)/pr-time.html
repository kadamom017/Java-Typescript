<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown & Quotes Application</title>

    <link rel="stylesheet" href="pr-time.css">
</head>
<body>

    <div class="container">

        <div class="card">

            <h1>Countdown & Quotes Application</h1>

            <h2>Countdown Timer</h2>

            <div id="countdown">Loading...</div>

            <div class="controls">
                <button class="start-btn" id="startBtn">
                    Start
                </button>

                <button class="pause-btn" id="pauseBtn">
                    Pause
                </button>
            </div>

            <div class="quote-box">

                <h2>Motivational Quotes</h2>

                <div id="quote"></div>

                <div class="quote-controls">

                    <button id="prevBtn">
                        Previous
                    </button>

                    <button id="nextBtn">
                        Next
                    </button>

                </div>

            </div>

        </div>

    </div>

    <div class="modal" id="modal">

        <div class="modal-content">

            <span class="close" id="closeModal">
                &times;
            </span>

            <h2>Welcome!</h2>

            <p>
                Welcome to Countdown & Quotes App.
            </p>

        </div>

    </div>

    <script src="pr-time.js"></script>

</body>
</html>
