<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>✨ Chroma Quiz · Creative UI</title>
        <!-- Bootstrap 5 + Icons -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
        <!-- Google Font: Space Grotesk (modern) + Quicksand for contrast -->
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <link rel="shortcut icon" href="./images/quiz.png" type="image/png">
        <link rel="stylesheet" href="./quiz.css">
    </head>
    <body>
        <!-- colorful orbs -->
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <!-- main card -->
        <div class="quiz-card">
            <!-- header -->
            <div class="quiz-header">
                <div class="quiz-title">
                    <div class="quiz-img">
                        <img src="./images/quiz.png" alt="quiz">
                    </div>
                    <span>ChromaQuiz</span>
                </div>
                <div class="badge-progress"><i class="bi bi-clock"></i><span id="timer">10</span>
                </div>
                <div class="badge-progress" id="questionCounter">
                </div>
            </div>
            <!-- question -->
            <div class="question-text" id="question">
                Which CSS property creates a <strong>rainbow</strong> gradient?
            </div>
            <!-- options -->
            <div class="options-grid" id="options">
            </div>
            <!-- footer -->
            <div class="quiz-footer">
                <div class="progress-track">
                    <div class="progress-dots" id="progressDots">
                        <!-- <span class="dot completed"></span>
                        <span class="dot completed"></span>
                        <span class="dot active"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span> -->
                    </div>
                    <!-- <span
                        style="font-size: 0.85rem; font-weight: 600; color: #3f1f50; opacity: 0.8;">
                        <i class="bi bi-arrow-right-circle"
                            style="color: #f5576c;"></i> Q3
                    </span> -->
                </div>

                <div style="display: flex; gap: 14px; flex-wrap: wrap;">
                    <button class="btn-soft" style="pointer-events: none;">
                        <i class="bi bi-arrow-left-circle"></i> Back
                    </button>
                    <button class="btn-primary-glow" id="nextBtn" >
                        Next <i class="bi bi-arrow-right-circle-fill"></i>
                    </button>
                </div>
            </div>
            <!-- micro label -->
            <div class="micro-label">
                <i class="bi bi-palette-fill"></i>
                <span>✨ creative · vibrant · animated</span>
                <i class="bi bi-emoji-laughing"></i>
            </div>
        </div>
        <!-- bootstrap bundle (for any potential toggles, but not used for UI) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        <script src="./quiz.js"></script>
    </body>
</html>
